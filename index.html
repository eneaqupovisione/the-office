<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Office — i lavori</title>

<!-- Nessun `?v=`, nessun service worker, nessun manifest: questa pagina si apre
     dal computer e basta. Il doppio numero di versione da tenere allineato a
     mano serviva a installare l'app sul telefono — e con il telefono che
     cattura in Note, non c'è piu' niente da installare. -->
<link rel="stylesheet" href="ufficio.css">

<!-- I colori e le misure stanno **qui**, dopo il foglio di stile, e non è
     un capriccio: `~/Attrezzi/studio-web` le legge con una regex su `:root`
     nel testo di questa pagina, e le regole che nascono toccando il sito le
     appende all'ultimo `<style>` del documento — che è questo. Stando dopo
     `ufficio.css`, quelle regole vincono senza dover alzare la specificità.

     Aprirlo:  node ~/Attrezzi/studio-web/studio.mjs "~/Lavori/the-office" ufficio.html?prova

     Lo studio tocca il tema chiaro: quello scuro sta nel `@media` qui sotto
     e si scrive a mano. -->
<style>
:root{
  --fondo:#F3F1EA; --carta:#FDFCF9; --carta-2:#EBE9E1;
  --ink:#14140F; --ink-2:#46453D; --tenue:#706E67;
  --linea:rgba(20,20,15,.09); --linea-forte:rgba(20,20,15,.17);
  --acc:#EDE93C; --acc-ink:#5E5900; --acc-tenue:rgba(224,219,60,.30);
  --su-acc:#14140F; --acc-forte:#E2DD1C;
  --male:#C2352A; --ok:#2E7548;
  --ombra-1:0 1px 2px rgba(16,16,22,.05);
  --ombra-2:0 1px 3px rgba(16,16,22,.06), 0 10px 28px -14px rgba(16,16,22,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --fondo:#100F0C; --carta:#1A1915; --carta-2:#24231E;
    --ink:#F4F2E9; --ink-2:#C7C4B7; --tenue:#8C8A7E;
    --linea:rgba(244,242,233,.10); --linea-forte:rgba(244,242,233,.19);
    --acc:#EDE93C; --acc-ink:#E4DF66; --acc-tenue:rgba(237,233,60,.16);
    --su-acc:#14140F; --acc-forte:#F5F158;
    --male:#E3705F; --ok:#63B981;
    --ombra-1:0 1px 2px rgba(0,0,0,.4);
    --ombra-2:0 1px 3px rgba(0,0,0,.5), 0 12px 30px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
</style>
</head>
<body>

<div class="foglio">

  <header class="testata">
    <h1>The Office</h1>
    <!-- Le tre sezioni, e sono tre domande diverse:
         Bacheca → cosa faccio adesso · Scrivania → cosa ho in mano ·
         Rubrica → per chi lavoro. Niente bottoni di servizio qui dentro:
         lo scandaglio si rifà da solo quando torni sulla finestra. -->
    <!-- Vuoto: i bottoni li fa `SEZIONI` in cima a ufficio.js. Averli scritti
         qui vorrebbe dire tenerli allineati a mano in due posti, che e' la
         forma di errore preferita di questo progetto. -->
    <nav class="sezioni" id="sezioni" hidden=""></nav>
    <span class="dove" id="dove"></span>
  </header>

  <!-- Tutto quello che si vede lo costruisce `ufficio.js`: le due viste non
       coesistono mai, quindi non ha senso tenerle tutte e due nel documento. -->
  <main id="palco"></main>

</div>

<!-- Script normali, non moduli: stessa scelta del resto del progetto.

     Ma **in locale** si caricano con un numero che cambia a ogni apertura, e
     non è un vezzo: senza, il browser tiene i `.js` in cache, tu modifichi un
     file, ricarichi, e non cambia niente. È lo stesso male del vecchio
     numero di versione da tenere allineato a mano in due file — la trappola
     che in questo progetto ha fatto perdere più tempo di tutte. Qui il numero
     se lo scrive la macchina, quindi non si può sbagliare.

     Fuori da localhost non si aggiunge niente: là la cache serve davvero.
     `async = false` tiene l'ordine di esecuzione, che conta — `radice.js`
     usa `Passi`, e `ufficio.js` li usa tutti. -->
<script>
(function(){
  var v = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? '?v=' + Date.now() : '';
  /* Anche il foglio di stile, e non era ovvio: il numero bustava i `.js` e
     lasciava fuori la CSS, che e' l'unico file caricato da un `<link>`. Il
     23 agosto ho passato dieci minuti a chiedermi perche' una regola scritta
     e salvata non si vedesse a schermo. */
  if (v){
    var l = document.querySelector('link[rel=stylesheet]');
    if (l) l.href = l.getAttribute('href').split('?')[0] + v;
  }
  ['passi.js', 'seed.js', 'radice.js', 'domande.js', 'ufficio.js'].forEach(function(f){
    var s = document.createElement('script');
    s.src = f + v;
    s.async = false;
    document.head.appendChild(s);
  });
})();
</script>


</body></html>
