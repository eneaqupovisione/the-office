# Nessuna costruzione: è il punto del progetto. Si pubblica la cartella così
# com'è, e l'unica cosa che gira è il portiere in netlify/functions/.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La funzione non deve finire fra i file serviti come pagina: il suo indirizzo
# è /.netlify/functions/cattura, non /netlify/functions/cattura.js
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
